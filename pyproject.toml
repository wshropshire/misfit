[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "misfit"
description = "MISFIT: Mutation Identification in Sequences and Frameshift/Indel Tracking - reference-anchored variant calling in chromosomal resistance genes of Enterobacterales."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "biopython>=1.80",
]

[[project.authors]]
name = "William Shropshire"
email = "wcshropshire@mdanderson.org"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/wshropshire/misfit"
Repository = "https://github.com/wshropshire/misfit"

[project.scripts]
misfit = "misfit.scripts.misfit:main"
misfit-db = "misfit.scripts.manage_refs:main"
misfit-multi = "misfit.scripts.multi:main"
misfit-wide = "misfit.scripts.wide:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
misfit = ["reference/**", "build/**"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["misfit*"]

[tool.setuptools.dynamic]
version = {attr = "misfit.scripts.version.__version__"}
